repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: local
    hooks:
      - id: public-source
        name: Check for private infrastructure references
        language: pygrep
        entry: '(?i)(ml[s]pace|ml[s]j|gig[a]\.|git[l]ab|clou[d]\.ru|job[_]submitter)'
        types: [text]
