[project]
name = "tiny-latent-reasoning"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
eval = ["lmms-eval", "sglang"]

[tool.uv.sources]
lmms-eval = { path = "vendor/lmms-eval" }

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.ruff]
extend-exclude = ["vendor"]
