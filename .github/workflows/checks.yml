name: Checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pre-commit/action@v3.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check baseline recipes
        run: python -m unittest discover -s tests -p test_baseline.py
