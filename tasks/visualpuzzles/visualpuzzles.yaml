task: visualpuzzles_full
dataset_path: neulab/VisualPuzzles
dataset_kwargs:
  revision: e6bc28fb1adcd27f25476b917e8c35c67b64027b
test_split: train
output_type: generate_until
doc_to_visual: !function utils.images
doc_to_text: !function utils.prompt
doc_to_target: answer
lmms_eval_specific_kwargs:
  default:
    prompt: MULTI_CHOICE_DIRECT_PROMPT
generation_kwargs:
  max_new_tokens: 128
  do_sample: false
process_results: !function utils.score
metric_list:
  - metric: accuracy
    aggregation: mean
    higher_is_better: true
